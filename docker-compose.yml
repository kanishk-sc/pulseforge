name: pulseforge

x-app: &app
  image: pulseforge-python:local
  build:
    context: .
    dockerfile: infra/docker/python.Dockerfile
  environment: &app-env
    POSTGRES_HOST: postgres
    POSTGRES_USER: ${POSTGRES_USER:-pulseforge}
    POSTGRES_DB: ${POSTGRES_DB:-pulseforge}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    S3_ENDPOINT_URL: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pulseforge}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/init_env.py first}
    REDIS_URL: redis://redis:6379/0
    ANALYTICS_CACHE_TTL_SECONDS: ${ANALYTICS_CACHE_TTL_SECONDS:-60}
    ANALYTICS_STALE_AFTER_SECONDS: ${ANALYTICS_STALE_AFTER_SECONDS:-7200}
    ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-disabled}
    ASSISTANT_PROVIDER_MODEL: ${ASSISTANT_PROVIDER_MODEL:-}
    ASSISTANT_PROVIDER_KEY: ${ASSISTANT_PROVIDER_KEY:-}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}
  init: true

services:
  redis:
    image: redis:7.4.7-alpine
    profiles: ["product"]
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    # pgvector's Postgres 16 Bookworm image keeps the existing data volume and major version.
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulseforge}
      POSTGRES_DB: ${POSTGRES_DB:-pulseforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports: ["127.0.0.1:9092:9092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  minio:
    image: pulseforge-minio:local
    build:
      context: .
      dockerfile: infra/docker/minio.Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pulseforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/init_env.py first}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  bootstrap:
    <<: *app
    command: python -m pulseforge.bootstrap
    depends_on:
      kafka: {condition: service_healthy}
      minio: {condition: service_healthy}
    restart: "no"

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./.cache/pulseforge-model:/app/.cache/pulseforge-model:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  streaming:
    image: pulseforge-streaming:local
    build:
      context: .
      dockerfile: infra/docker/spark.Dockerfile
    profiles: ["streaming"]
    environment:
      <<: *app-env
      STREAM_NAMESPACE: ${STREAM_NAMESPACE:-v1}
      STREAM_TRIGGER: ${STREAM_TRIGGER:-5 seconds}
      STREAM_MAX_OFFSETS: ${STREAM_MAX_OFFSETS:-1000}
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_SUBMIT_ARGS: --driver-memory 1g pyspark-shell
    init: true
    mem_limit: 3g
    depends_on:
      postgres: {condition: service_healthy}
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/tmp/pulseforge-streaming-health.json'); assert p.exists() and time.time()-p.stat().st_mtime<20"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 3
    stop_grace_period: 120s
    restart: "no"

  producer:
    <<: *app
    profiles: ["traffic"]
    command: python -m pulseforge.producer
    environment:
      <<: *app-env
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-10}
      ANOMALY_RATE: ${ANOMALY_RATE:-0.02}
      GENERATOR_SEED: ${GENERATOR_SEED:-42}
      PULSEFORGE_PRODUCER_METRICS: "1"
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    stop_grace_period: 45s
    restart: "no"

  analytics-dbt:
    image: pulseforge-dbt:local
    build:
      context: .
      dockerfile: infra/docker/dbt.Dockerfile
    profiles: ["analytics"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-pulseforge}
      POSTGRES_DB: ${POSTGRES_DB:-pulseforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
      DBT_SCHEMA: ${DBT_SCHEMA:-analytics}
      DBT_TARGET_PATH: /tmp/dbt-target
      DBT_LOG_PATH: /tmp/dbt-logs
    volumes: ["./analytics:/app/analytics:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    init: true
    mem_limit: 768m
    restart: "no"

  airflow:
    image: pulseforge-airflow:local
    build:
      context: .
      dockerfile: infra/docker/airflow.Dockerfile
    profiles: ["airflow"]
    command: standalone
    environment:
      AIRFLOW_HOME: /opt/airflow/state
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: pulseforge:admin
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/state/logs
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-pulseforge}
      POSTGRES_DB: ${POSTGRES_DB:-pulseforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
      DBT_SCHEMA: ${DBT_SCHEMA:-analytics}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["airflow-state:/opt/airflow/state"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    init: true
    mem_limit: 1536m
    restart: "no"

  dashboard:
    image: pulseforge-dashboard:local
    build:
      context: ./frontend
    profiles: ["product"]
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  product-migrate:
    <<: *app
    profiles: ["product"]
    command: python -m pulseforge.product.cli migrate
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  detector:
    <<: *app
    profiles: ["product"]
    command: python -m pulseforge.product.cli detect
    depends_on:
      product-migrate: {condition: service_completed_successfully}
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=48h
      - --storage.tsdb.retention.size=512MB
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - "./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./observability/alerts.yml:/etc/prometheus/alerts.yml:ro"
      - "./observability/alert-tests.yml:/etc/prometheus/alert-tests.yml:ro"
      - "prometheus-data:/prometheus"
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run scripts/init_env.py first}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - "./observability/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro"
      - "grafana-data:/var/lib/grafana"
    depends_on:
      prometheus: {condition: service_started}
    restart: unless-stopped

  ops-exporter:
    <<: *app
    profiles: ["observability"]
    command: python -m pulseforge.ops_exporter
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 256m
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.143.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    ports: ["127.0.0.1:4318:4318"]
    volumes:
      - "./observability/otel-collector.yml:/etc/otelcol/config.yaml:ro"
    mem_limit: 256m
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.9.5
    profiles: ["observability"]
    # The named local volume is created root-owned; Tempo otherwise cannot create blocks.
    user: "0:0"
    command: ["-config.file=/etc/tempo.yaml"]
    ports: ["127.0.0.1:3200:3200"]
    volumes:
      - "./observability/tempo.yml:/etc/tempo.yaml:ro"
      - "tempo-data:/tmp/tempo"
    mem_limit: 512m
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  minio-data:
  airflow-state:
  redis-data:
  grafana-data:
  prometheus-data:
  tempo-data:
