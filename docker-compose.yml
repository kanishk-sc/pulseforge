name: pulseforge

x-app: &app
  image: pulseforge-python:local
  build:
    context: .
    dockerfile: infra/docker/python.Dockerfile
  environment: &app-env
    POSTGRES_HOST: postgres
    POSTGRES_USER: ${POSTGRES_USER:-pulseforge}
    POSTGRES_DB: ${POSTGRES_DB:-pulseforge}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    S3_ENDPOINT_URL: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pulseforge}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/init_env.py first}
    REDIS_URL: redis://redis:6379/0
    ANALYTICS_CACHE_TTL_SECONDS: ${ANALYTICS_CACHE_TTL_SECONDS:-60}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  init: true

services:
  redis:
    image: redis:7.4.7-alpine
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:16.9-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulseforge}
      POSTGRES_DB: ${POSTGRES_DB:-pulseforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports: ["127.0.0.1:9092:9092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pulseforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/init_env.py first}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  bootstrap:
    <<: *app
    command: python -m pulseforge.bootstrap
    depends_on:
      kafka: {condition: service_healthy}
      minio: {condition: service_healthy}
    restart: "no"

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  producer:
    <<: *app
    profiles: ["traffic"]
    command: python -m pulseforge.producer
    environment:
      <<: *app-env
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-10}
      ANOMALY_RATE: ${ANOMALY_RATE:-0.02}
      GENERATOR_SEED: ${GENERATOR_SEED:-42}
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    stop_grace_period: 45s
    restart: "no"

  spark:
    image: pulseforge-spark:local
    build:
      context: .
      dockerfile: infra/docker/spark.Dockerfile
    profiles: ["streaming"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-pulseforge}
      POSTGRES_DB: ${POSTGRES_DB:-pulseforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: commerce.events.v1
      KAFKA_DEAD_LETTER_TOPIC: commerce.dead-letter.v1
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: pulseforge
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pulseforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/init_env.py first}
      SPARK_CHECKPOINT_ROOT: /opt/spark/checkpoints
      SPARK_WATERMARK_DELAY: ${SPARK_WATERMARK_DELAY:-10 minutes}
      SPARK_TRIGGER_INTERVAL: ${SPARK_TRIGGER_INTERVAL:-10 seconds}
      SPARK_MAX_OFFSETS_PER_TRIGGER: ${SPARK_MAX_OFFSETS_PER_TRIGGER:-10000}
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-4}
    ports: ["127.0.0.1:4040:4040"]
    volumes: ["spark-checkpoints:/opt/spark/checkpoints"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      bootstrap: {condition: service_completed_successfully}
    init: true
    stop_grace_period: 45s
    restart: unless-stopped

  dbt:
    image: pulseforge-dbt:local
    build:
      context: .
      dockerfile: infra/docker/dbt.Dockerfile
    profiles: ["analytics"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-pulseforge}
      POSTGRES_DB: ${POSTGRES_DB:-pulseforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    volumes: ["./analytics/dbt:/workspace"]
    depends_on:
      postgres: {condition: service_healthy}

  airflow-init:
    image: pulseforge-airflow:local
    profiles: ["orchestration"]
    user: "0:0"
    entrypoint: /bin/bash
    command: -c "mkdir -p /opt/airflow/state /opt/airflow/artifacts && chown -R 50000:0 /opt/airflow/state /opt/airflow/artifacts"
    volumes:
      - "airflow-state:/opt/airflow/state"
      - "./artifacts:/opt/airflow/artifacts"
    restart: "no"

  airflow:
    image: pulseforge-airflow:local
    build:
      context: .
      dockerfile: infra/docker/airflow.Dockerfile
    profiles: ["orchestration"]
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
      DBT_LOG_PATH: /opt/airflow/artifacts/dbt-logs
      DBT_TARGET_PATH: /opt/airflow/artifacts/dbt-target
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-pulseforge}
      POSTGRES_DB: ${POSTGRES_DB:-pulseforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: pulseforge
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pulseforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/init_env.py first}
      LAKE_RETENTION_DAYS: ${LAKE_RETENTION_DAYS:-30}
      LAKE_RETENTION_DRY_RUN: ${LAKE_RETENTION_DRY_RUN:-true}
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - "./orchestration/dags:/opt/airflow/dags"
      - "./analytics/dbt:/opt/pulseforge/dbt"
      - "./artifacts:/opt/airflow/artifacts"
      - "airflow-state:/opt/airflow/state"
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    restart: unless-stopped

  dashboard:
    image: pulseforge-dashboard:local
    build:
      context: ./frontend
    profiles: ["product"]
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - "./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-pulseforge-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - "./observability/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro"
      - "grafana-data:/var/lib/grafana"
    depends_on:
      prometheus: {condition: service_started}
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  minio-data:
  spark-checkpoints:
  airflow-state:
  redis-data:
  grafana-data:
