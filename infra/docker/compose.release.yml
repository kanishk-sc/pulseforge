# Compose override for an isolated, single-host release. Always pass -p with a new
# project name. No service binds a non-loopback host address; AWS has no ingress SG.
# The source SHA is mandatory for application image tags and a release manifest
# records actual image IDs. This file never downloads a model or calls a provider.
x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    ports: !override ["127.0.0.1:${PF_RELEASE_POSTGRES_PORT:-15432}:5432"]
    mem_limit: 2g
    logging: *bounded-logging
    stop_grace_period: 60s
  kafka:
    image: apache/kafka@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    ports: !override ["127.0.0.1:${PF_RELEASE_KAFKA_PORT:-19092}:9092"]
    environment:
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:${PF_RELEASE_KAFKA_PORT:-19092}"
    mem_limit: 2g
    logging: *bounded-logging
    stop_grace_period: 60s
  minio:
    image: pulseforge-minio:${PULSEFORGE_RELEASE_SHA:?Set a full reviewed Git commit SHA}
    ports: !override
      - "127.0.0.1:${PF_RELEASE_MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${PF_RELEASE_MINIO_CONSOLE_PORT:-19001}:9001"
    mem_limit: 2g
    logging: *bounded-logging
    stop_grace_period: 60s
  bootstrap:
    image: pulseforge-python:${PULSEFORGE_RELEASE_SHA:?Set a full reviewed Git commit SHA}
    mem_limit: 512m
    logging: *bounded-logging
  api:
    image: pulseforge-python:${PULSEFORGE_RELEASE_SHA:?Set a full reviewed Git commit SHA}
    ports: !override ["127.0.0.1:${PF_RELEASE_API_PORT:-18000}:8000"]
    volumes: !override ["model-cache:/app/.cache/pulseforge-model:ro"]
    mem_limit: 1536m
    logging: *bounded-logging
    stop_grace_period: 30s
  streaming:
    image: pulseforge-streaming:${PULSEFORGE_RELEASE_SHA:?Set a full reviewed Git commit SHA}
    mem_limit: 3g
    logging: *bounded-logging
    deploy:
      replicas: 1
  producer:
    image: pulseforge-python:${PULSEFORGE_RELEASE_SHA:?Set a full reviewed Git commit SHA}
    mem_limit: 512m
    logging: *bounded-logging
    deploy:
      replicas: 1
  analytics-dbt:
    image: pulseforge-dbt:${PULSEFORGE_RELEASE_SHA:?Set a full reviewed Git commit SHA}
    deploy:
      replicas: 1
    logging: *bounded-logging
  airflow:
    image: pulseforge-airflow:${PULSEFORGE_RELEASE_SHA:?Set a full reviewed Git commit SHA}
    ports: !override ["127.0.0.1:${PF_RELEASE_AIRFLOW_PORT:-18080}:8080"]
    deploy:
      replicas: 1
    logging: *bounded-logging
  dashboard:
    image: pulseforge-dashboard:${PULSEFORGE_RELEASE_SHA:?Set a full reviewed Git commit SHA}
    ports: !override ["127.0.0.1:${PF_RELEASE_DASHBOARD_PORT:-15173}:80"]
    mem_limit: 256m
    logging: *bounded-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
  product-migrate:
    image: pulseforge-python:${PULSEFORGE_RELEASE_SHA:?Set a full reviewed Git commit SHA}
    mem_limit: 512m
    logging: *bounded-logging
  detector:
    image: pulseforge-python:${PULSEFORGE_RELEASE_SHA:?Set a full reviewed Git commit SHA}
    mem_limit: 512m
    logging: *bounded-logging
  assistant-model:
    image: pulseforge-python:${PULSEFORGE_RELEASE_SHA:?Set a full reviewed Git commit SHA}
    profiles: ["assistant-setup"]
    command: python -m pulseforge.assistant.cli download-model
    volumes: ["model-cache:/app/.cache/pulseforge-model"]
    mem_limit: 1536m
    logging: *bounded-logging
    restart: "no"
  assistant-migrate:
    image: pulseforge-python:${PULSEFORGE_RELEASE_SHA:?Set a full reviewed Git commit SHA}
    profiles: ["assistant-setup"]
    command: python -m pulseforge.assistant.cli migrate
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-pulseforge}
      POSTGRES_DB: ${POSTGRES_DB:-pulseforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 512m
    logging: *bounded-logging
    restart: "no"
  assistant-ingest:
    image: pulseforge-python:${PULSEFORGE_RELEASE_SHA:?Set a full reviewed Git commit SHA}
    profiles: ["assistant-setup"]
    command: python -m pulseforge.assistant.cli ingest
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-pulseforge}
      POSTGRES_DB: ${POSTGRES_DB:-pulseforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    volumes: ["model-cache:/app/.cache/pulseforge-model:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 1536m
    logging: *bounded-logging
    restart: "no"
  redis:
    image: redis@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    mem_limit: 256m
    logging: *bounded-logging
  ops-exporter:
    image: pulseforge-python:${PULSEFORGE_RELEASE_SHA:?Set a full reviewed Git commit SHA}
    logging: *bounded-logging
  prometheus:
    ports: !override ["127.0.0.1:${PF_RELEASE_PROMETHEUS_PORT:-19090}:9090"]
    mem_limit: 512m
    logging: *bounded-logging
  grafana:
    ports: !override ["127.0.0.1:${PF_RELEASE_GRAFANA_PORT:-13000}:3000"]
    mem_limit: 512m
    logging: *bounded-logging
  otel-collector:
    ports: !override ["127.0.0.1:${PF_RELEASE_OTEL_PORT:-14318}:4318"]
    logging: *bounded-logging
  tempo:
    ports: !override ["127.0.0.1:${PF_RELEASE_TEMPO_PORT:-13200}:3200"]
    logging: *bounded-logging

volumes:
  model-cache:
