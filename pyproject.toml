[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulseforge"
version = "0.1.0"
description = "Real-time commerce and logistics data operations platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1", "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "aiokafka>=0.12,<1", "boto3>=1.36,<2", "httpx>=0.28,<1",
  "redis[hiredis]>=6.4,<7", "prometheus-client>=0.26,<1",
  "opentelemetry-api>=1.39,<2", "opentelemetry-sdk>=1.39,<2",
  "opentelemetry-instrumentation-fastapi>=0.60b0,<1",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "fastembed==0.7.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
  "pyarrow>=19,<22",
  "pyspark==4.0.1",
]

[project.optional-dependencies]
streaming = ["pyspark==4.0.1", "psycopg[binary]>=3.2,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/pulseforge"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires the running Docker Compose foundation",
  "spark: exercises local Spark transformations",
  "streaming: requires the streaming profile and performs controlled restarts/outages",
  "analytics: requires PostgreSQL and the analytics dbt image",
  "product: requires PostgreSQL and a successful product analytics publication",
  "assistant: requires PostgreSQL, pgvector, and a populated runbook corpus",
]
