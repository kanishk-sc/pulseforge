name: pulseforge_analytics
version: 1.0.0
config-version: 2

profile: pulseforge_analytics

model-paths: ["models"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

on-run-start:
  - "set timezone to 'UTC'"

models:
  pulseforge_analytics:
    staging:
      +materialized: view
      +schema: staging
    dimensions:
      +materialized: table
      +schema: core
    facts:
      +schema: core
    marts:
      +materialized: table
      +schema: marts
