name: Platform CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.11.16"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python scripts/init_env.py
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run python scripts/export_schema.py --check
      - run: uv run pytest -m "not integration"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: docker compose --profile streaming build streaming
      - run: docker compose --profile product build dashboard
      - run: docker compose --profile observability config --quiet
  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.11.16"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python scripts/init_env.py
      - run: docker compose config --quiet
      - run: docker compose --profile streaming up -d --build --wait --wait-timeout 240
      - run: uv run pytest -m integration --run-integration --run-streaming --junitxml=integration-results.xml
      - if: failure()
        run: docker compose --profile streaming logs --no-color --tail 100
      - if: always()
        run: docker compose --profile streaming down
  analytics-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.11.16"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python scripts/init_env.py
      - run: docker compose config --quiet
      - run: docker compose up -d --wait --wait-timeout 120 postgres
      - run: docker compose --profile analytics build analytics-dbt
      - run: docker compose --profile airflow build airflow
      - run: docker compose --profile analytics run --rm analytics-dbt compile
      - run: docker compose --profile airflow run --rm --no-deps airflow python /opt/pulseforge/scripts/verify_airflow_dag.py
      - run: uv run pytest -m analytics --run-integration --run-analytics --junitxml=analytics-results.xml
      - if: failure()
        run: docker compose --profile analytics --profile airflow logs --no-color --tail 100
      - if: always()
        run: docker compose --profile analytics --profile airflow down
  product-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.11.16"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python scripts/init_env.py
      - run: docker compose config --quiet
      - run: docker compose up -d --wait --wait-timeout 120 postgres
      - run: docker compose --profile product run --rm --build product-migrate
      - name: Prepare versioned assistant corpus with local embeddings
        run: |
          uv run python -m pulseforge.assistant.cli migrate
          uv run python -m pulseforge.assistant.cli download-model
          uv run python -m pulseforge.assistant.cli ingest
      - name: Seed deterministic anomaly
        id: seed
        shell: bash
        run: |
          seed_json=$(uv run python scripts/seed_product_acceptance.py)
          echo "$seed_json"
          detector_now=$(python -c 'import json,sys; print(json.load(sys.stdin)["detector_now"])' <<< "$seed_json")
          echo "detector_now=$detector_now" >> "$GITHUB_OUTPUT"
      - run: docker compose --profile airflow build airflow
      - name: Build, publish, and detect
        run: >-
          docker compose --profile airflow run --rm --no-deps airflow
          python -m pulseforge.product.cli pipeline
          --build-key "ci-${{ github.run_id }}-${{ github.run_attempt }}"
          --project-dir /opt/pulseforge/analytics
          --profiles-dir /opt/pulseforge/analytics
          --detector-now "${{ steps.seed.outputs.detector_now }}"
      - run: docker compose --profile product up -d --build --wait --wait-timeout 180 redis api dashboard
      - name: Verify PostgreSQL to API incident flow
        run: uv run pytest -vv tests/test_product_integration.py --run-integration --run-product --junitxml=product-results.xml
      - name: Verify pgvector retrieval and offline incident explanation
        run: |
          uv run pytest -vv tests/test_assistant_integration.py --run-integration --run-assistant --junitxml=assistant-results.xml
          uv run python scripts/evaluate_assistant.py --split all --output phase6-ci-eval.json
      - name: Verify live observability stack
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
          OTEL_TRACE_SAMPLE_RATIO: "1"
        run: |
          docker compose --profile observability up -d --wait --wait-timeout 180 api ops-exporter prometheus tempo otel-collector grafana
          docker compose exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
          docker compose exec -T prometheus promtool test rules /etc/prometheus/alert-tests.yml
          uv run python scripts/verify_observability.py
          uv run python scripts/load_phase5.py --scenario warm --requests 5 --concurrency 2 --output phase5-smoke.json
      - if: failure()
        run: docker compose --profile product --profile airflow --profile observability logs --no-color --tail 150
      - if: always()
        run: docker compose --profile product --profile airflow --profile observability down
