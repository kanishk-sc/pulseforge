name: Foundation CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run python scripts/export_schema.py --check
      - run: uv run pytest -m "not integration"
  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python scripts/init_env.py
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: uv run pytest -m integration --run-integration
      - if: failure()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down
