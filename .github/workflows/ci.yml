name: Platform CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.11.16"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python scripts/init_env.py
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run python scripts/export_schema.py --check
      - run: uv run pytest -m "not integration"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: docker compose --profile streaming build streaming
      - run: docker compose --profile product build dashboard
      - run: docker compose --profile observability config --quiet
  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.11.16"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python scripts/init_env.py
      - run: docker compose config --quiet
      - run: docker compose --profile streaming up -d --build --wait --wait-timeout 240
      - run: uv run pytest -m integration --run-integration --run-streaming --junitxml=integration-results.xml
      - if: failure()
        run: docker compose --profile streaming logs --no-color --tail 100
      - if: always()
        run: docker compose --profile streaming down
  analytics-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.11.16"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python scripts/init_env.py
      - run: docker compose config --quiet
      - run: docker compose up -d --wait --wait-timeout 120 postgres
      - run: docker compose --profile analytics build analytics-dbt
      - run: docker compose --profile airflow build airflow
      - run: docker compose --profile analytics run --rm analytics-dbt compile
      - run: docker compose --profile airflow run --rm --no-deps airflow python /opt/pulseforge/scripts/verify_airflow_dag.py
      - run: uv run pytest -m analytics --run-integration --run-analytics --junitxml=analytics-results.xml
      - if: failure()
        run: docker compose --profile analytics --profile airflow logs --no-color --tail 100
      - if: always()
        run: docker compose --profile analytics --profile airflow down
